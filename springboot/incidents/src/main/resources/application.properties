spring.application.name=saba-incidents-service
server.port=${SERVER_PORT:8082}

# Base de datos exclusiva del microservicio incidents (separada de parking y de Room).
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

# Servicio parking para validar IDs REMOTOS. Si no responde, POST falla controladamente.
saba.services.parking.base-url=${PARKING_SERVICE_URL:http://localhost:8081}

# Sin issuer Cognito configurado se rechazan todas las solicitudes protegidas.
saba.security.cognito.issuer-uri=${COGNITO_ISSUER_URI:}
saba.security.cognito.client-id=${COGNITO_APP_CLIENT_ID:}

spring.config.import=optional:file:./config/local.properties