spring.application.name=saba-parkings-service
server.port=${SERVER_PORT:8081}

# PostgreSQL independiente de Room y de otros microservicios.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/saba_parking}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

# Dejar sin configurar mantiene todos los endpoints protegidos (401).
# Ejemplo: https://cognito-idp.us-east-1.amazonaws.com/us-east-1_XXXX
saba.security.cognito.issuer-uri=${COGNITO_ISSUER_URI:}
saba.security.cognito.client-id=${COGNITO_APP_CLIENT_ID:}
