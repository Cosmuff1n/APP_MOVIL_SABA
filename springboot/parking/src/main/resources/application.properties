spring.application.name=saba-parkings-service
server.port=${SERVER_PORT:8081}

# PostgreSQL independiente de Room y de otros microservicios.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

# Dejar sin configurar mantiene todos los endpoints protegidos (401).
# Ejemplo: https://cognito-idp.us-east-1.amazonaws.com/us-east-1_XXXX
saba.security.cognito.issuer-uri=${COGNITO_ISSUER_URI:}
saba.security.cognito.client-id=${COGNITO_APP_CLIENT_ID:}

spring.config.import=optional:file:./config/local.properties

# Un unico DTO por entidad: no ignorar campos JSON desconocidos.
spring.jackson.deserialization.fail-on-unknown-properties=true
