spring.application.name=bff
server.port=4000

api.auth.baseUrl=${AUTH_BASE_URL:http://localhost:4004}
api.customer.baseUrl=${CUSTOMER_BASE_URL:http://localhost:4001}
api.ticket.baseUrl=${TICKET_BASE_URL:http://localhost:4002}
api.inspection.baseUrl=${INSPECTION_BASE_URL:http://localhost:4003}

api.technician.baseUrl=${TECHNICIAN_BASE_URL:http://localhost:4005}
api.device.baseUrl=${DEVICE_BASE_URL:http://localhost:4006}
api.appointment.baseUrl=${APPOINTMENT_BASE_URL:http://localhost:4007}
api.quote.baseUrl=${QUOTE_BASE_URL:http://localhost:4008}
api.repair.baseUrl=${REPAIR_BASE_URL:http://localhost:4009}
api.inventory.baseUrl=${INVENTORY_BASE_URL:http://localhost:4010}
api.payment.baseUrl=${PAYMENT_BASE_URL:http://localhost:4011}
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.persist-authorization=true

# GlitchTip / Sentry observability
# Configure this with the DSN from your GlitchTip project.
sentry.dsn=http://f62bc36fa9d041e9b5e4653aa3e89951@localhost:8000/1
sentry.release=${SENTRY_RELEASE:0.0.1-SNAPSHOT}
sentry.environment=${SENTRY_ENVIRONMENT:development}
sentry.traces-sample-rate=${SENTRY_TRACES_SAMPLE_RATE:0.1}
sentry.send-default-pii=false
sentry.logs.enabled=true
sentry.logging.minimum-level=info
sentry.logging.minimum-event-level=error
sentry.logging.minimum-breadcrumb-level=debug
sentry.exception-resolver-order=-2147483647
sentry.logging.context-tags=requestId

logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] [service=${spring.application.name}] [requestId=%X{requestId}] %-5level %logger{36} - %msg%n
