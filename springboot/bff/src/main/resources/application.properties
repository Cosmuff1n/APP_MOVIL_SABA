spring.application.name=saba-bff
server.port=${SERVER_PORT:8080}

# El BFF no tiene datasource ni repositorios JPA.
saba.services.parking.base-url=${PARKING_SERVICE_URL:http://localhost:8081}
saba.services.incidents.base-url=${INCIDENTS_SERVICE_URL:http://localhost:8082}

# Obligatorio para aceptar tokens Cognito. Sin issuer, se rechaza todo acceso protegido.
saba.security.cognito.issuer-uri=${COGNITO_ISSUER_URI:}
saba.security.cognito.client-id=${COGNITO_APP_CLIENT_ID:}

spring.config.import=optional:file:./config/local.properties
